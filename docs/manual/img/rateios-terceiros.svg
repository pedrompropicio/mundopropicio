<svg viewBox="0 0 640 430" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" style="font-family: inherit; color: hsl(var(--foreground));">
  <title id="title">Custo partilhado com terceiros</title><desc id="desc">A fatura divide-se entre o resultado da MP e uma conta de circuito.</desc>
  <defs><marker id="arrow-terceiros" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="hsl(var(--primary))"/></marker></defs>
  <rect x="220" y="20" width="200" height="58" rx="10" fill="hsl(var(--primary) / .08)" stroke="hsl(var(--primary))" stroke-width="2"/>
  <g fill="none" stroke="hsl(var(--border))" stroke-width="2"><rect x="25" y="150" width="250" height="82" rx="10"/><rect x="365" y="150" width="250" height="82" rx="10"/><rect x="25" y="318" width="250" height="72" rx="10"/><rect x="365" y="318" width="250" height="72" rx="10"/><rect x="418" y="256" width="144" height="36" rx="18" fill="hsl(var(--warning) / .12)" stroke="hsl(var(--warning))"/></g>
  <g fill="none" stroke="hsl(var(--primary))" stroke-width="2" marker-end="url(#arrow-terceiros)"><path d="M320 78 V112 H150 V150"/><path d="M320 112 H490 V150"/><path d="M150 232 V318"/><path d="M490 232 V318"/></g>
  <g fill="currentColor" text-anchor="middle" font-size="16"><text x="320" y="55">Fatura total</text><text x="150" y="177"><tspan x="150">Parte da MP → resultado</tspan><tspan x="150" dy="23">linha do BP</tspan></text><text x="490" y="177"><tspan x="490">Parte de terceiros</tspan><tspan x="490" dy="23">conta de circuito</tspan></text><text x="150" y="347"><tspan x="150">custo da MP apurado</tspan><tspan x="150" dy="22">resultado</tspan></text><text x="490" y="347"><tspan x="490">devolução do terceiro</tspan><tspan x="490" dy="22">baixa a conta</tspan></text><text x="490" y="279" font-size="14" font-weight="600" fill="hsl(var(--warning))">No fecho: conta a zero</text></g>
  <text x="319" y="342" text-anchor="middle" fill="hsl(var(--muted-foreground))" font-size="13" transform="rotate(-90 319 342)">pago pela conta de circuito</text>
</svg>