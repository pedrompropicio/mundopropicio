<svg viewBox="0 0 660 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" style="font-family: inherit; color: hsl(var(--foreground));">
  <title id="title">Ciclo de uma transitória</title><desc id="desc">O dinheiro entra na conta, passa pela conta como transitória e sai ou volta. O resultado do evento, por baixo, não é tocado.</desc>
  <defs><marker id="arrow-tr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="hsl(var(--primary))"/></marker></defs>
  <g fill="none" stroke="hsl(var(--border))" stroke-width="2">
    <rect x="20" y="34" width="180" height="64" rx="10"/>
    <rect x="240" y="34" width="180" height="64" rx="10" stroke="hsl(var(--primary))"/>
    <rect x="460" y="34" width="180" height="64" rx="10"/>
  </g>
  <g stroke="hsl(var(--primary))" stroke-width="2" fill="none">
    <line x1="200" y1="66" x2="236" y2="66" marker-end="url(#arrow-tr)"/>
    <line x1="420" y1="66" x2="456" y2="66" marker-end="url(#arrow-tr)"/>
  </g>
  <g fill="currentColor" font-size="14" text-anchor="middle">
    <text x="110" y="71">Entra na conta</text>
    <text x="330" y="62">Passa pela conta</text>
    <text x="330" y="82" fill="hsl(var(--muted-foreground))" font-size="12">(transitória)</text>
    <text x="550" y="71">Sai / volta</text>
  </g>
  <line x1="330" y1="98" x2="330" y2="160" stroke="hsl(var(--muted-foreground))" stroke-width="2" stroke-dasharray="5 5"/>
  <text x="342" y="134" fill="hsl(var(--muted-foreground))" font-size="12">não toca</text>
  <rect x="20" y="164" width="620" height="64" rx="10" fill="hsl(var(--muted))" stroke="hsl(var(--border))" stroke-width="2"/>
  <text x="330" y="192" fill="currentColor" font-size="14" text-anchor="middle">Resultado do evento</text>
  <text x="330" y="212" fill="hsl(var(--muted-foreground))" font-size="12" text-anchor="middle">DRE · Fecho · BP · custo do evento — a transitória fica de fora</text>
</svg>
