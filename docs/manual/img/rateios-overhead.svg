<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" style="font-family: inherit; color: hsl(var(--foreground));">
  <title id="title">Rateio de Overhead</title><desc id="desc">Um custo já pago entra numa linha de Overhead e segue para o acerto com sócios.</desc>
  <defs><marker id="arrow-overhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="hsl(var(--primary))"/></marker></defs>
  <g fill="none" stroke="hsl(var(--border))" stroke-width="2"><rect x="16" y="42" width="140" height="76" rx="10"/><rect x="176" y="42" width="140" height="76" rx="10"/><rect x="336" y="42" width="140" height="76" rx="10"/><rect x="496" y="42" width="128" height="76" rx="10" fill="hsl(var(--primary) / .08)" stroke="hsl(var(--primary))"/><rect x="170" y="182" width="300" height="42" rx="10" stroke-dasharray="6 5"/></g>
  <g fill="none" stroke="hsl(var(--primary))" stroke-width="2" marker-end="url(#arrow-overhead)"><path d="M156 80 H176"/><path d="M316 80 H336"/><path d="M476 80 H496"/></g>
  <g fill="currentColor" text-anchor="middle" font-size="15"><text x="86" y="70"><tspan x="86">Custo já pago</tspan><tspan x="86" dy="21">pela empresa</tspan></text><text x="246" y="70"><tspan x="246">Linha Overhead</tspan><tspan x="246" dy="21">no BP</tspan></text><text x="406" y="70"><tspan x="406">÷N pelas cidades</tspan><tspan x="406" dy="21">via Master</tspan></text><text x="560" y="70"><tspan x="560">Acerto</tspan><tspan x="560" dy="21">com sócios</tspan></text><text x="320" y="208" fill="hsl(var(--muted-foreground))">sem transação · fora do resultado da empresa</text></g>
</svg>