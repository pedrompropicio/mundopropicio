<svg viewBox="0 0 660 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" style="font-family: inherit; color: hsl(var(--foreground));">
  <title id="title">Sequência do fecho do evento</title><desc id="desc">Fechar sessões e circuitos, conferir receitas e custos, acertar com os sócios, selar o fechamento e só depois concluir o evento.</desc>
  <defs><marker id="arrow-seq" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="hsl(var(--primary))"/></marker></defs>
  <g fill="none" stroke="hsl(var(--border))" stroke-width="2">
    <rect x="20" y="34" width="180" height="58" rx="10"/>
    <rect x="240" y="34" width="180" height="58" rx="10"/>
    <rect x="460" y="34" width="180" height="58" rx="10"/>
    <rect x="240" y="158" width="180" height="58" rx="10"/>
    <rect x="460" y="158" width="180" height="58" rx="10"/>
  </g>
  <rect x="20" y="158" width="180" height="58" rx="10" fill="hsl(var(--primary) / .08)" stroke="hsl(var(--primary))" stroke-width="2"/>
  <g fill="none" stroke="hsl(var(--primary))" stroke-width="2" marker-end="url(#arrow-seq)">
    <path d="M200 63 H240"/><path d="M420 63 H460"/><path d="M550 92 V128 H110 V158"/><path d="M200 187 H240"/><path d="M420 187 H460"/>
  </g>
  <g fill="currentColor" text-anchor="middle" font-size="15">
    <text x="110" y="58"><tspan x="110">1. Fechar sessões</tspan><tspan x="110" dy="20" font-size="13" fill="hsl(var(--muted-foreground))">camarim e cartões</tspan></text>
    <text x="330" y="58"><tspan x="330">2. Zerar circuitos</tspan><tspan x="330" dy="20" font-size="13" fill="hsl(var(--muted-foreground))">acerto com terceiros</tspan></text>
    <text x="550" y="58"><tspan x="550">3. Conferir receitas</tspan><tspan x="550" dy="20" font-size="13" fill="hsl(var(--muted-foreground))">e custos</tspan></text>
    <text x="110" y="182"><tspan x="110">4. Encontro de Contas</tspan><tspan x="110" dy="20" font-size="13" fill="hsl(var(--muted-foreground))">C1 e C2 a 0,00 €</tspan></text>
    <text x="330" y="182"><tspan x="330">5. Selar fechamento</tspan><tspan x="330" dy="20" font-size="13" fill="hsl(var(--muted-foreground))">e exportar PDFs</tspan></text>
    <text x="550" y="182"><tspan x="550">6. Concluir evento</tspan><tspan x="550" dy="20" font-size="13" fill="hsl(var(--muted-foreground))">bloqueia alterações</tspan></text>
  </g>
</svg>
