<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" style="font-family: inherit; color: hsl(var(--foreground));">
  <title id="title">Rateio por vários eventos</title><desc id="desc">Uma fatura cria uma mãe sem evento e partes ligadas aos eventos.</desc>
  <defs><marker id="arrow-varios" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="hsl(var(--primary))"/></marker></defs>
  <g fill="none" stroke="hsl(var(--border))" stroke-width="2"><rect x="24" y="42" width="118" height="58" rx="10"/><rect x="195" y="24" width="420" height="94" rx="10" fill="hsl(var(--primary) / .08)" stroke="hsl(var(--primary))"/><rect x="20" y="228" width="180" height="82" rx="10"/><rect x="230" y="228" width="180" height="82" rx="10"/><rect x="440" y="228" width="180" height="82" rx="10"/><rect x="105" y="334" width="430" height="34" rx="9" stroke-dasharray="6 5"/></g>
  <g fill="none" stroke="hsl(var(--primary))" stroke-width="2" marker-end="url(#arrow-varios)"><path d="M142 71 H195"/><path d="M405 118 V174 H110 V228"/><path d="M405 174 H320 V228"/><path d="M405 174 H530 V228"/></g>
  <g fill="currentColor" text-anchor="middle" font-size="16"><text x="83" y="77">Fatura</text><text x="405" y="52"><tspan x="405">Transação-mãe sem evento</tspan><tspan x="405" dy="23">é paga · move a conta</tspan></text><text x="110" y="254"><tspan x="110">Evento X · %</tspan><tspan x="110" dy="23">linha do BP</tspan></text><text x="320" y="254"><tspan x="320">Evento Y · %</tspan><tspan x="320" dy="23">linha do BP</tspan></text><text x="530" y="254"><tspan x="530">Evento Z · %</tspan><tspan x="530" dy="23">linha do BP</tspan></text><text x="320" y="357" font-size="14" fill="hsl(var(--muted-foreground))">paga-se a mãe; os relatórios de evento contam as partes</text></g>
</svg>