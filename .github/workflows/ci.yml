name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install
        run: bun install --frozen-lockfile || bun install
      - name: Typecheck (tsgo)
        run: bunx --bun -p @typescript/native-preview tsgo -p tsconfig.app.json --noEmit
      - name: Testes (vitest)
        run: |
          set -o pipefail
          bunx vitest run 2>&1 | tee vitest.log
      - name: Resumo dos testes
        if: always()
        run: |
          {
            echo "## Vitest"
            echo '```'
            grep -E "Test Files|Tests " vitest.log || echo "sem resumo"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build (vite)
        run: bunx vite build
