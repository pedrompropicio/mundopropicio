name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Diário (07:10 UTC, como run_invariant_checks): o invariante
  # edge_fn_sem_guarda_empresa vive no vitest porque o código das edge
  # functions não está na base.
  schedule:
    - cron: "10 7 * * *"
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - name: Install
        run: bun install --frozen-lockfile || bun install
      - name: Typecheck (tsgo)
        run: bunx -p @typescript/native-preview tsgo -p tsconfig.app.json --noEmit
      - name: Testes (vitest)
        run: |
          set -o pipefail
          bunx vitest run 2>&1 | tee vitest.log
      - name: Resumo dos testes
        if: always()
        run: |
          {
            echo "## Vitest"
            echo '```'
            grep -E "Test Files|Tests " vitest.log || echo "sem resumo"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Canário runtime verify_jwt
        # Declarar verify_jwt no ficheiro não prova que a definição foi implantada.
        # Os dois secrets são obrigatórios para o canário de rede; se faltarem, o
        # script termina com erro (nunca finge cobertura verde).
        env:
          EDGE_GATE_BASE_URL: ${{ secrets.EDGE_GATE_BASE_URL }}
          EDGE_GATE_ANON_KEY: ${{ secrets.EDGE_GATE_ANON_KEY }}
        run: bun scripts/probe-edge-jwt-gate.mjs
      - name: Build (vite)
        run: bunx vite build
