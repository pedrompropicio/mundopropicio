# E2b (#417): um comentário "## Despacho — #N" do Pedro (ou do operador nomeado na Autorização, #521) numa Issue aberta lança o
# executor designado na Autorização (Codex por defeito; Claude Code por designação)
# num runner. Só R1: código e testes. D-ERP348.
# Travas determinísticas antes de qualquer IA; o agente não tem credenciais de push
# nem segredos de base de dados; a entrega é um PR para main, nunca lovable/dev.
# #753: com «- **Repositório:** mundopropicio-replay» na Autorização, o executor trabalha numa
# cópia do replay privado (token E2B_REPLAY_TOKEN, só esse repo), o PR abre-se no replay, sem
# merge automático, e o Fecho continua a ser comentado na Issue deste repo. Sem o campo, nada muda.
name: Executor (E2b)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  travas:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'open' &&
      contains(fromJSON('["pedrompropicio","mplabs-dev"]'), github.event.comment.user.login) &&
      startsWith(github.event.comment.body, '## Despacho') &&
      !startsWith(github.event.comment.body, '## Despacho recusado')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      ok: ${{ steps.avaliar.outputs.ok }}
      merge_automatico: ${{ steps.avaliar.outputs.merge_automatico }}
      executor: ${{ steps.avaliar.outputs.executor }}
      preparacao_r2: ${{ steps.avaliar.outputs.preparacao_r2 }}
      repo_alvo: ${{ steps.avaliar.outputs.repo_alvo }}
      caminhos_github: ${{ steps.avaliar.outputs.caminhos_github }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Avaliar despacho
        id: avaliar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bun scripts/executor/travas.ts avaliar
      - name: Comentar recusa
        if: steps.avaliar.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file recusa.md
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: tarefa
          path: tarefa.md
          retention-days: 7

  executar:
    needs: travas
    # Um despacho de cada vez POR ISSUE (decisão do Pedro, 03/11/2026): Issues diferentes
    # correm em paralelo — as Reservas já separam os componentes por Issue e o CI do PR
    # apanha conflitos no merge. Dentro da mesma Issue continua a fila. Fica ao nível do job
    # para que comentários comuns (runs ignorados) não entrem na fila.
    concurrency:
      group: executor-${{ github.event.issue.number }}
      cancel-in-progress: false
    if: needs.travas.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read
    env:
      REPO_ALVO: ${{ needs.travas.outputs.repo_alvo }}
      CAMINHOS_GITHUB: ${{ needs.travas.outputs.caminhos_github }}
    steps:
      - uses: actions/checkout@v4
        if: needs.travas.outputs.repo_alvo != 'mundopropicio-replay'
        with:
          ref: main
          persist-credentials: false
      # #753: cópia de trabalho do replay, sem credenciais gravadas (o agente nunca as vê).
      - uses: actions/checkout@v4
        if: needs.travas.outputs.repo_alvo == 'mundopropicio-replay'
        with:
          repository: ${{ github.repository_owner }}/mundopropicio-replay
          ref: main
          token: ${{ secrets.E2B_REPLAY_TOKEN }}
          persist-credentials: false
      # As travas vêm sempre do main deste repo e saem da cópia de trabalho antes do agente correr.
      - uses: actions/checkout@v4
        if: needs.travas.outputs.repo_alvo == 'mundopropicio-replay'
        with:
          ref: main
          path: .e2b-travas
          persist-credentials: false
      - name: Travas fora da cópia do replay
        if: needs.travas.outputs.repo_alvo == 'mundopropicio-replay'
        run: mv .e2b-travas "$RUNNER_TEMP/e2b-travas"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        if: needs.travas.outputs.repo_alvo != 'mundopropicio-replay'
        run: |
          bun install --frozen-lockfile || bun install
          bunx -p @typescript/native-preview tsgo --version
      - uses: actions/download-artifact@v4
        with:
          name: tarefa
          path: ${{ runner.temp }}/e2b
      - name: Corpo da Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue view "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --json body -q .body > "${{ runner.temp }}/e2b/issue.md"
      - name: Montar prompt
        id: prompt
        env:
          PREPARACAO_R2: ${{ needs.travas.outputs.preparacao_r2 }}
        run: |
          if [ "$REPO_ALVO" = "mundopropicio-replay" ]; then
            echo 'ferramentas=Read,Edit,Write,Glob,Grep,Bash(python3 -m unittest:*),Bash(python3 -m py_compile:*),Bash(sha256sum:*),Bash(git diff:*),Bash(git status:*),Bash(ls:*),Bash(mkdir -p .executor)' >> "$GITHUB_OUTPUT"
          else
            echo 'ferramentas=Read,Edit,Write,Glob,Grep,Bash(bunx vitest:*),Bash(bunx -p @typescript/native-preview tsgo:*),Bash(bun run test:*),Bash(git diff:*),Bash(git status:*),Bash(ls:*),Bash(mkdir -p .executor)' >> "$GITHUB_OUTPUT"
          fi
          {
            echo 'texto<<FIM_PROMPT_E2B'
            if [ "$REPO_ALVO" = "mundopropicio-replay" ]; then
            echo "És o executor da E2b na Issue #${{ github.event.issue.number }} do repositório ${{ github.repository }}. A tua cópia de trabalho é o repositório PRIVADO ${{ github.repository_owner }}/mundopropicio-replay (branch main), não o repositório principal. Classe R1: só código e testes."
            echo "Lê primeiro o README do replay e os ficheiros que o despacho indicar."
            if [ -n "$CAMINHOS_GITHUB" ]; then
              echo "Regras do replay: não toques em .github/, excepto exactamente nestes caminhos listados no despacho: $CAMINHOS_GITHUB (qualquer outro ficheiro em .github/ faz o PR ser recusado)."
            else
              echo "Regras do replay: não toques em .github/ (o despacho não lista nenhum caminho; o PR é recusado)."
            fi
            echo "Nunca ligues a bases de dados (nem homolog nem Live) nem a serviços da MP; não leias segredos nem variáveis; não corras nem dispares workflows; não toques em ficheiros .env; sem commits nem push: só editas a cópia local."
            echo "O repo é privado, mas o resumo vai para uma Issue pública: no resumo não escrevas identificadores de projectos, hosts, refs, utilizadores de base de dados nem dados comerciais."
            echo "Testes: corre só os que o despacho indicar (por exemplo python3 -m unittest ...). Não corras bun install, tsgo nem vitest do repositório principal."
            else
            echo "És o executor da E2b na Issue #${{ github.event.issue.number }} do repositório ${{ github.repository }}. Classe R1: só código e testes."
            echo "Lê primeiro docs/INDEX.md e o que ele indicar para o tema; procura em .lovable/memory/features/ e docs/ antes de propor."
            if [ "$PREPARACAO_R2" = "true" ]; then
              echo "Regras: modo preparação R2 — podes escrever ficheiros em drizzle/migrations/NNNN_*.sql (com cópia em supabase/manual/ e rollback comentado) e em supabase/functions/; nunca executes SQL nem deploys; não toques em .github/, .lovable/, drizzle/migrations/meta/ nem ficheiros .env."
            else
              echo "Regras: não toques em .github/, supabase/, drizzle/, .lovable/ nem ficheiros .env (o PR é recusado). Sem rede para serviços da MP, sem Live, sem DDL/DML, sem commits nem push: só editas a cópia local."
            fi
            echo "Antes de terminar corre: bunx -p @typescript/native-preview tsgo -p tsconfig.app.json --noEmit e bunx vitest run, e corrige o que falhar."
            fi
            echo "No fim escreve .executor/resumo.md com as secções '### Feito' e '### Não feito / lacunas' (itens '- ' de topo, um predicado verificável por linha)."
            echo "Se não puderes fazer exactamente a tarefa, pára, não inventes, e explica em '### Não feito / lacunas'."
            echo "Dificuldade, volume ou tempo não são motivo para parar: entrega o que ficar a compilar e com testes verdes e lista o resto em '### Não feito / lacunas'. A regra «pára e reporta» do AGENTS.md aplica-se só a caminhos fora da lista autorizada ou a instruções impossíveis."
            echo ""
            echo "Tarefa (texto do despacho do Pedro):"
            cat "${{ runner.temp }}/e2b/tarefa.md"
            # tarefa.md não termina em nova linha: sem este echo o delimitador colava à última linha.
            echo
            echo "Corpo da Issue #${{ github.event.issue.number }} (contexto; em conflito, o despacho prevalece):"
            cat "${{ runner.temp }}/e2b/issue.md"
            echo
            echo 'FIM_PROMPT_E2B'
          } >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        if: needs.travas.outputs.executor == 'claude-code'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ steps.prompt.outputs.texto }}
          claude_args: >-
            --max-turns 60
            --allowedTools "${{ steps.prompt.outputs.ferramentas }}"
      - name: Codex
        if: needs.travas.outputs.executor == 'codex'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROMPT: ${{ steps.prompt.outputs.texto }}
        run: |
          npm install -g @openai/codex
          test -n "$OPENAI_API_KEY" && echo "OPENAI_API_KEY presente (${#OPENAI_API_KEY} caracteres)" || { echo "OPENAI_API_KEY ausente" >&2; exit 1; }
          printf '%s' "$OPENAI_API_KEY" | codex login --with-api-key
          echo "codex_inicio=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"
          codex exec --sandbox workspace-write --skip-git-repo-check -C "$GITHUB_WORKSPACE" -c model_reasoning_effort="high" --output-last-message "$RUNNER_TEMP/e2b/codex-ultima.md" "$PROMPT"
          echo "codex_fim=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"
      - name: Recolher alterações
        run: |
          mkdir -p "${{ runner.temp }}/saida"
          [ -f .executor/resumo.md ] && cp .executor/resumo.md "${{ runner.temp }}/saida/resumo.md"
          [ -f "$RUNNER_TEMP/e2b/codex-ultima.md" ] && cp "$RUNNER_TEMP/e2b/codex-ultima.md" "${{ runner.temp }}/saida/ultima-mensagem.md"
          if [ "${{ needs.travas.outputs.executor }}" = "codex" ]; then
            echo "Codex: ${codex_inicio:-?} → ${codex_fim:-?}"
          else
            echo "n/d"
          fi > "${{ runner.temp }}/saida/duracao.txt"
          rm -rf .executor
          git add -A
          git diff --cached --name-only > "${{ runner.temp }}/saida/ficheiros.txt"
          # Sem resumo do agente, o workflow gera um a partir dos ficheiros alterados.
          if [ ! -s "${{ runner.temp }}/saida/resumo.md" ]; then
            {
              echo "### Feito"
              if [ -s "${{ runner.temp }}/saida/ficheiros.txt" ]; then
                sed 's/^/- ficheiro alterado: `/; s/$/`/' "${{ runner.temp }}/saida/ficheiros.txt"
              else
                echo "- nenhum ficheiro alterado"
              fi
              echo
              echo "### Não feito / lacunas"
              echo "- o executor não escreveu .executor/resumo.md (resumo gerado pelo workflow)"
            } > "${{ runner.temp }}/saida/resumo.md"
          fi
          git diff --cached --binary > "${{ runner.temp }}/saida/exec.patch"
          echo "Ficheiros alterados:"; cat "${{ runner.temp }}/saida/ficheiros.txt"
      - name: Travas de caminhos
        env:
          PREPARACAO_R2: ${{ needs.travas.outputs.preparacao_r2 }}
        run: |
          if [ "$REPO_ALVO" = "mundopropicio-replay" ]; then
            bun "$RUNNER_TEMP/e2b-travas/scripts/executor/travas.ts" caminhos "${{ runner.temp }}/saida/ficheiros.txt" --replay "--github-permitidos=$CAMINHOS_GITHUB"
          else
            EXTRA=""
            [ "$PREPARACAO_R2" = "true" ] && EXTRA="--preparacao-r2"
            bun scripts/executor/travas.ts caminhos "${{ runner.temp }}/saida/ficheiros.txt" $EXTRA
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: saida
          path: ${{ runner.temp }}/saida
          retention-days: 14

  entregar:
    needs: [travas, executar]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    env:
      # #753: no replay o push e o PR usam só o E2B_REPLAY_TOKEN (sem recurso a outros tokens).
      GH_TOKEN: ${{ needs.travas.outputs.repo_alvo == 'mundopropicio-replay' && secrets.E2B_REPLAY_TOKEN || needs.travas.outputs.repo_alvo != 'mundopropicio-replay' && (secrets.EXECUTOR_TOKEN || secrets.GITHUB_TOKEN) || '' }}
      TEM_EXECUTOR_TOKEN: ${{ secrets.EXECUTOR_TOKEN != '' }}
      TEM_REPLAY_TOKEN: ${{ secrets.E2B_REPLAY_TOKEN != '' }}
      REPO_ALVO: ${{ needs.travas.outputs.repo_alvo }}
      REPO_REPLAY: ${{ github.repository_owner }}/mundopropicio-replay
      CAMINHOS_GITHUB: ${{ needs.travas.outputs.caminhos_github }}
      ISSUE: ${{ github.event.issue.number }}
      RAMO: exec/${{ github.event.issue.number }}-${{ github.run_id }}
      # Decisão do Pedro (01/11/2026): merge automático por defeito; "Merge automático: não" na autorização desliga.
      MERGE_AUTO: ${{ needs.travas.outputs.merge_automatico }}
      EXECUTOR: ${{ needs.travas.outputs.executor }}
      PREPARACAO_R2: ${{ needs.travas.outputs.preparacao_r2 }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Token do replay presente?
        if: needs.travas.outputs.repo_alvo == 'mundopropicio-replay'
        run: |
          [ "$TEM_REPLAY_TOKEN" = "true" ] || { echo "E2B_REPLAY_TOKEN ausente: sem entrega no replay" >&2; exit 1; }
      - uses: actions/checkout@v4
        if: needs.travas.outputs.repo_alvo != 'mundopropicio-replay'
        with:
          ref: main
          # #417: com o EXECUTOR_TOKEN (token do Pedro) o push e o PR ficam em nome dele, o CI do PR
          # corre sem aprovação e o auto-merge funciona. Sem o secret, cai no GITHUB_TOKEN (merge manual).
          token: ${{ secrets.EXECUTOR_TOKEN || secrets.GITHUB_TOKEN }}
      # #753: replay sem credenciais gravadas; o push usa o token só no próprio comando.
      - uses: actions/checkout@v4
        if: needs.travas.outputs.repo_alvo == 'mundopropicio-replay'
        with:
          repository: ${{ github.repository_owner }}/mundopropicio-replay
          ref: main
          token: ${{ secrets.E2B_REPLAY_TOKEN }}
          persist-credentials: false
      - uses: actions/checkout@v4
        if: needs.travas.outputs.repo_alvo == 'mundopropicio-replay'
        with:
          ref: main
          path: .e2b-travas
          persist-credentials: false
      - name: Travas fora da cópia do replay
        if: needs.travas.outputs.repo_alvo == 'mundopropicio-replay'
        run: mv .e2b-travas "$RUNNER_TEMP/e2b-travas"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/download-artifact@v4
        with:
          name: saida
          path: ${{ runner.temp }}/saida
      - name: Sem alterações?
        id: vazio
        run: |
          if [ ! -s "${{ runner.temp }}/saida/exec.patch" ]; then echo "sim=true" >> "$GITHUB_OUTPUT"; else echo "sim=false" >> "$GITHUB_OUTPUT"; fi
      - name: Aplicar e voltar a conferir caminhos
        if: steps.vazio.outputs.sim == 'false'
        run: |
          git apply --index "${{ runner.temp }}/saida/exec.patch"
          git diff --cached --name-only > ficheiros.txt
          if [ "$REPO_ALVO" = "mundopropicio-replay" ]; then
            bun "$RUNNER_TEMP/e2b-travas/scripts/executor/travas.ts" caminhos ficheiros.txt --replay "--github-permitidos=$CAMINHOS_GITHUB"
          else
            EXTRA=""
            [ "$PREPARACAO_R2" = "true" ] && EXTRA="--preparacao-r2"
            bun scripts/executor/travas.ts caminhos ficheiros.txt $EXTRA
          fi
      - name: Install
        if: steps.vazio.outputs.sim == 'false' && needs.travas.outputs.repo_alvo != 'mundopropicio-replay'
        run: bun install --frozen-lockfile || bun install
      - name: Testes (determinístico, fora da IA)
        id: testes
        if: steps.vazio.outputs.sim == 'false' && needs.travas.outputs.repo_alvo != 'mundopropicio-replay'
        continue-on-error: true
        run: |
          set -o pipefail
          bunx -p @typescript/native-preview tsgo -p tsconfig.app.json --noEmit
          bunx vitest run 2>&1 | tee vitest.log
      - name: Commit, PR e CI
        id: pr
        if: steps.vazio.outputs.sim == 'false'
        run: |
          case "$EXECUTOR" in
            claude-code) MOTOR="Claude Code" ;;
            codex) MOTOR="Codex" ;;
            *) echo "Executor não suportado: $EXECUTOR" >&2; exit 1 ;;
          esac
          git config user.name "executor-e2b[bot]"
          git config user.email "executor-e2b@users.noreply.github.com"
          git checkout -b "$RAMO"
          git commit -m "E2b #$ISSUE: entrega do executor ($MOTOR)" -m "Run: $RUN_URL"
          if [ "$REPO_ALVO" = "mundopropicio-replay" ]; then
            # #753: PR no replay, para main, com o token do replay; nunca merge automático nem workflows.
            AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
            echo "::add-mask::$AUTH"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin "$RAMO"
            {
              echo "Entrega do executor E2b para ${{ github.repository }}#$ISSUE. Run: $RUN_URL"
              echo
              echo "Testes no runner: não corridos pelo workflow (replay: só os testes indicados no despacho, corridos pelo executor; ver resumo)."
              echo
              cat "${{ runner.temp }}/saida/resumo.md"
              echo
              echo "Merge automático: desligado (replay). Revisão e merge só pelo 0 MP. Não fecha a Issue nem liberta a reserva."
            } > "$RUNNER_TEMP/corpo-pr.md"
            URL=$(gh pr create --repo "$REPO_REPLAY" --base main --head "$RAMO" --title "E2b #$ISSUE: entrega do executor ($MOTOR)" --body-file "$RUNNER_TEMP/corpo-pr.md")
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "auto=desligado (replay: merge só pelo 0 MP)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push origin "$RAMO"
          RESULTADO="${{ steps.testes.outcome }}"
          DRAFT=""; [ "$RESULTADO" = "success" ] || DRAFT="--draft"
          {
            echo "Entrega do executor E2b para #$ISSUE. Run: $RUN_URL"
            echo
            echo "Testes no runner (tsgo + vitest): **$RESULTADO**."
            echo
            cat "${{ runner.temp }}/saida/resumo.md"
            echo
            echo "Revisão e merge seguem o fluxo normal. Não fecha a Issue nem liberta a reserva."
          } > corpo-pr.md
          URL=$(gh pr create --base main --head "$RAMO" --title "E2b #$ISSUE: entrega do executor ($MOTOR)" --body-file corpo-pr.md $DRAFT)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          # PRs criados com o GITHUB_TOKEN não disparam o CI; o workflow_dispatch dispara
          # e liga o check "quality" ao mesmo commit.
          # Com o EXECUTOR_TOKEN o próprio PR dispara o CI; só sem ele é preciso o workflow_dispatch.
          if [ "$TEM_EXECUTOR_TOKEN" != "true" ]; then gh workflow run ci.yml --ref "$RAMO"; fi
          # Merge automático: só com testes verdes no runner; o GitHub espera ainda pelo CI "quality".
          AUTO="desligado nesta tarefa"
          if [ "$MERGE_AUTO" = "true" ] && [ "$RESULTADO" = "success" ]; then
            if gh pr merge "$URL" --auto --squash; then AUTO="ligado (entra quando o CI quality ficar verde)"; else AUTO="pedido falhou: ver run (repositório sem «Allow auto-merge»?)"; fi
          elif [ "$MERGE_AUTO" = "true" ]; then
            AUTO="não ligado: testes do runner falharam"
          fi
          echo "auto=$AUTO" >> "$GITHUB_OUTPUT"
      - name: Fecho na Issue
        if: always()
        env:
          # O Fecho continua a ser do bot, não do Pedro.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          case "$EXECUTOR" in
            claude-code) MOTOR="Claude Code" ;;
            codex) MOTOR="Codex" ;;
            *) echo "Executor não suportado: $EXECUTOR" >&2; exit 1 ;;
          esac
          {
            if [ "${{ steps.vazio.outputs.sim }}" = "true" ]; then
              echo "## Fecho — #$ISSUE (SEM ENTREGA — executor E2b, $MOTOR)"
              echo
              echo "Sem alterações de código: o executor terminou sem diff. Ver «Última mensagem do executor» abaixo."
            else
              echo "## Fecho — #$ISSUE (executor E2b, $MOTOR)"
              echo
              if [ "$REPO_ALVO" = "mundopropicio-replay" ]; then
                echo "- **Repositório:** mundopropicio-replay (privado)"
              fi
              echo "- **PR:** ${{ steps.pr.outputs.url || 'não criado (ver run)' }}"
              if [ "$REPO_ALVO" = "mundopropicio-replay" ]; then
                echo "- **Testes no runner:** não corridos pelo workflow (replay: testes do despacho, ver resumo)"
              else
                echo "- **Testes no runner:** ${{ steps.testes.outcome }}"
              fi
              echo "- **Merge automático:** ${{ steps.pr.outputs.auto || 'não pedido' }}"
            fi
            echo "- **Run:** $RUN_URL"
            echo
            cat "${{ runner.temp }}/saida/resumo.md" 2>/dev/null || printf '### Não feito / lacunas\n- resumo do executor indisponível\n'
            echo
            echo "### Duração"
            if [ -f "${{ runner.temp }}/saida/duracao.txt" ]; then
              cat "${{ runner.temp }}/saida/duracao.txt"
            fi
            echo
            echo "### Última mensagem do executor"
            if [ -f "${{ runner.temp }}/saida/ultima-mensagem.md" ]; then
              tail -n 60 "${{ runner.temp }}/saida/ultima-mensagem.md"
            fi
            echo
            echo "Pronto para revisão por leitura. A reserva continua activa até ser libertada."
          } > fecho.md
          gh issue comment "$ISSUE" --repo "${{ github.repository }}" --body-file fecho.md
          if [ "${{ steps.vazio.outputs.sim }}" = "true" ]; then
            exit 1
          fi
