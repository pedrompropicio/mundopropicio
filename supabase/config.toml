    verify_jwt = true
  [functions.database-backup]
    verify_jwt = true
  [functions.database-restore]
    verify_jwt = true
  [functions.selective-restore]
    verify_jwt = true
  [functions.surgical-restore]
    verify_jwt = true
  [functions.crm-meta-oauth-callback]
    verify_jwt = false
  [functions.crm-meta-funnel-test-run]
    verify_jwt = false
  [functions.crm-meta-funnel-test-status]
    verify_jwt = false
  [functions.crm-meta-extract-landing-urls]
    verify_jwt = false
  # fetch-fever-reports: pode ser chamado por cron (sem JWT user) ou pela UI (JWT).
  # Mantemos verify_jwt=false e o caller passa configId/mode no body.
  [functions.fetch-fever-reports]
    verify_jwt = false
  [functions.update-fever-credentials]
    verify_jwt = false
  [functions.update-fever-b2b-token]
    verify_jwt = false
